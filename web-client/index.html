<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus SFU Test Client</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 20px; color: #00d9ff; }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
        button { padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; transition: all 0.2s; }
        button:hover { transform: translateY(-2px); }
        .btn-primary { background: #00d9ff; color: #1a1a2e; }
        .btn-danger { background: #ff4757; color: white; }
        .btn-success { background: #2ed573; color: #1a1a2e; }
        .btn-secondary { background: #57606f; color: white; }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .videos { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .video-container { background: #16213e; border-radius: 12px; overflow: hidden; position: relative; }
        .video-container video { width: 100%; display: block; background: #000; }
        .video-label { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 5px 10px; border-radius: 4px; font-size: 12px; }
        .status { background: #16213e; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .status h3 { margin-bottom: 10px; color: #00d9ff; }
        .status-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #2a2a4a; }
        .status-item:last-child { border-bottom: none; }
        .log { background: #0f0f23; border-radius: 12px; padding: 15px; height: 200px; overflow-y: auto; font-family: 'Monaco', 'Menlo', monospace; font-size: 12px; }
        .log-entry { padding: 4px 0; border-bottom: 1px solid #1a1a2e; }
        .log-entry.error { color: #ff4757; }
        .log-entry.success { color: #2ed573; }
        .log-entry.info { color: #00d9ff; }
        .config { background: #16213e; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .config input { width: 100%; padding: 10px; border: 1px solid #2a2a4a; border-radius: 6px; background: #0f0f23; color: #eee; margin-top: 5px; }
        .config label { display: block; margin-bottom: 15px; }
        .config label span { font-size: 12px; color: #888; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Nexus SFU Test Client</h1>
        
        <div class="config">
            <label>
                WebSocket URL
                <span>(Use localhost for camera access, not 127.0.0.1)</span>
                <input type="text" id="wsUrl" value="ws://localhost:8080">
            </label>
            <label>
                Room ID
                <input type="text" id="roomId" value="test-room">
            </label>
            <label>
                Your Name
                <input type="text" id="participantName" value="Browser User">
            </label>
        </div>

        <div class="controls">
            <button id="connectBtn" class="btn-primary">Connect</button>
            <button id="publishBtn" class="btn-success" disabled>Publish Camera</button>
            <button id="unpublishBtn" class="btn-secondary" disabled>Stop Publishing</button>
            <button id="disconnectBtn" class="btn-danger" disabled>Disconnect</button>
        </div>

        <div class="videos">
            <div class="video-container">
                <video id="localVideo" autoplay muted playsinline></video>
                <div class="video-label">Local (You)</div>
            </div>
            <div class="video-container" id="remoteVideos">
                <video id="remoteVideo" autoplay playsinline></video>
                <div class="video-label">Remote</div>
            </div>
        </div>

        <div class="status">
            <h3>Connection Status</h3>
            <div class="status-item"><span>WebSocket</span><span id="wsStatus">Disconnected</span></div>
            <div class="status-item"><span>WebRTC</span><span id="rtcStatus">Not Started</span></div>
            <div class="status-item"><span>ICE State</span><span id="iceStatus">-</span></div>
            <div class="status-item"><span>Room</span><span id="roomStatus">-</span></div>
            <div class="status-item"><span>Participant ID</span><span id="participantId">-</span></div>
        </div>

        <div class="log" id="log"></div>
    </div>

    <script>
        // State
        let ws = null;
        let pc = null;
        let localStream = null;
        let myParticipantId = null;

        // DOM elements
        const connectBtn = document.getElementById('connectBtn');
        const publishBtn = document.getElementById('publishBtn');
        const unpublishBtn = document.getElementById('unpublishBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const wsUrlInput = document.getElementById('wsUrl');
        const roomIdInput = document.getElementById('roomId');
        const participantNameInput = document.getElementById('participantName');

        // Logging
        function log(msg, type = '') {
            const logEl = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logEl.appendChild(entry);
            logEl.scrollTop = logEl.scrollHeight;
            console.log(msg);
        }

        function updateStatus(id, value) {
            document.getElementById(id).textContent = value;
        }

        // WebSocket connection
        connectBtn.onclick = async () => {
            const wsUrl = wsUrlInput.value;
            const roomId = roomIdInput.value;
            const participantName = participantNameInput.value;
            
            log(`Connecting to ${wsUrl}...`, 'info');
            updateStatus('wsStatus', 'Connecting...');

            try {
                ws = new WebSocket(wsUrl);
                
                ws.onopen = () => {
                    log('WebSocket connected!', 'success');
                    updateStatus('wsStatus', 'Connected');
                    connectBtn.disabled = true;
                    disconnectBtn.disabled = false;
                    publishBtn.disabled = false;

                    // First create a room, then join it
                    // The Create message will return a room_id that we use to join
                    // For simplicity, we use the input as room name and create first
                    ws.send(JSON.stringify({
                        type: 'Create',
                        room_name: roomId || null
                    }));
                    updateStatus('roomStatus', 'Creating...');
                };

                ws.onmessage = (event) => {
                    const msg = JSON.parse(event.data);
                    log(`Received: ${msg.type}`, 'info');
                    handleSignalingMessage(msg);
                };

                ws.onerror = (err) => {
                    console.log({err})
                    log(`WebSocket error: ${err}`, 'error');
                    updateStatus('wsStatus', 'Error');
                };

                ws.onclose = () => {
                    log('WebSocket disconnected', 'error');
                    updateStatus('wsStatus', 'Disconnected');
                    cleanup();
                };
            } catch (err) {
                log(`Connection failed: ${err}`, 'error');
            }
        };

        // Handle signaling messages (matches SignalMessage enum variants)
        async function handleSignalingMessage(msg) {
            switch (msg.type) {
                case 'Created':
                    // Room created, now join it with the assigned room_id
                    log(`Room created with ID ${msg.room_id}`, 'success');
                    const participantName = participantNameInput.value;
                    ws.send(JSON.stringify({
                        type: 'Join',
                        room_id: msg.room_id,
                        participant_name: participantName
                    }));
                    updateStatus('roomStatus', `Room ${msg.room_id}`);
                    break;
                    
                case 'Joined':
                    myParticipantId = msg.participant_id;
                    log(`Joined room ${msg.room_id} as participant ${msg.participant_id}`, 'success');
                    updateStatus('participantId', msg.participant_id);
                    if (msg.participants && msg.participants.length > 0) {
                        log(`Other participants: ${msg.participants.map(p => p.name).join(', ')}`, 'info');
                    }
                    // Subscribe to any existing tracks in the room
                    if (msg.tracks && msg.tracks.length > 0) {
                        log(`Subscribing to ${msg.tracks.length} existing track(s)`, 'info');
                        for (const trackId of msg.tracks) {
                            ws.send(JSON.stringify({ type: 'Subscribe', track_id: trackId }));
                        }
                    }
                    break;

                case 'ParticipantJoined':
                    log(`Participant joined: ${msg.name} (ID: ${msg.participant_id})`, 'info');
                    break;

                case 'ParticipantLeft':
                    log(`Participant left: ${msg.participant_id}`, 'info');
                    break;

                case 'OfferReceived':
                    log(`Received offer from participant ${msg.from_participant_id}`, 'info');
                    await handleOffer(msg.sdp, msg.from_participant_id);
                    break;

                case 'AnswerReceived':
                    log(`Received answer from participant ${msg.from_participant_id}`, 'info');
                    if (pc) {
                        await pc.setRemoteDescription({ type: 'answer', sdp: msg.sdp });
                        updateStatus('rtcStatus', 'Connected');
                    }
                    break;

                case 'IceCandidate':
                    log(`Received ICE candidate from participant ${msg.target_participant_id}`, 'info');
                    if (pc) {
                        await pc.addIceCandidate({
                            candidate: msg.candidate,
                            sdpMid: msg.sdp_mid,
                            sdpMLineIndex: msg.sdp_mline_index
                        });
                    }
                    break;

                case 'EndOfCandidates':
                    log('End of ICE candidates received', 'info');
                    break;

                case 'TrackPublished':
                    log(`Track published: ${msg.kind} from participant ${msg.publisher_id}`, 'info');
                    // Subscribe to the track
                    ws.send(JSON.stringify({
                        type: 'Subscribe',
                        track_id: msg.track_id
                    }));
                    break;

                case 'TrackUnpublished':
                    log(`Track unpublished: ${msg.track_id}`, 'info');
                    break;

                case 'Subscribed':
                    log(`Subscribed to track ${msg.track_id}`, 'success');
                    break;

                case 'Error':
                    log(`Server error [${msg.code}]: ${msg.message}`, 'error');
                    break;

                case 'Pong':
                    // Keepalive response
                    break;

                case 'ServerShutdown':
                    log(`Server shutting down: ${msg.reason} (${msg.drain_seconds}s)`, 'error');
                    break;

                default:
                    log(`Unknown message type: ${msg.type}`);
            }
        }

        // Create peer connection
        function createPeerConnection() {
            const config = {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]
            };

            pc = new RTCPeerConnection(config);
            updateStatus('rtcStatus', 'Created');

            pc.onicecandidate = (event) => {
                if (event.candidate && event.candidate.candidate && ws && myParticipantId) {
                    // Send ICE candidate - matches SignalMessage::IceCandidate format
                    ws.send(JSON.stringify({
                        type: 'IceCandidate',
                        target_participant_id: 0, // 0 = broadcast to SFU
                        candidate: event.candidate.candidate,
                        sdp_mid: event.candidate.sdpMid,
                        sdp_mline_index: event.candidate.sdpMLineIndex
                    }));
                    log('Sent ICE candidate', 'info');
                }
            };

            pc.oniceconnectionstatechange = () => {
                updateStatus('iceStatus', pc.iceConnectionState);
                log(`ICE state: ${pc.iceConnectionState}`);
            };

            pc.onconnectionstatechange = () => {
                updateStatus('rtcStatus', pc.connectionState);
                log(`Connection state: ${pc.connectionState}`);
            };

            pc.ontrack = (event) => {
                log('Received remote track!', 'success');
                remoteVideo.srcObject = event.streams[0];
            };

            return pc;
        }

        // Handle incoming offer
        async function handleOffer(sdp, fromParticipantId) {
            if (!pc) createPeerConnection();
            
            await pc.setRemoteDescription({ type: 'offer', sdp });
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            
            // Send answer - matches SignalMessage::Answer format
            ws.send(JSON.stringify({
                type: 'Answer',
                target_participant_id: fromParticipantId,
                sdp: answer.sdp
            }));
            log('Sent answer', 'success');
        }

        // Publish camera
        publishBtn.onclick = async () => {
            try {
                // Check if mediaDevices is available (requires HTTPS or localhost)
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    throw new Error('Camera access requires HTTPS or localhost. Try opening: http://localhost:3000');
                }
                
                log('Requesting camera access...', 'info');
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 1280, height: 720 },
                    audio: true
                });
                
                localVideo.srcObject = localStream;
                log('Camera access granted', 'success');

                if (!pc) createPeerConnection();

                // Add tracks to peer connection
                localStream.getTracks().forEach(track => {
                    pc.addTrack(track, localStream);
                    log(`Added ${track.kind} track`, 'info');
                });

                // Create and send offer - matches SignalMessage::Offer format
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                
                ws.send(JSON.stringify({
                    type: 'Offer',
                    target_participant_id: null, // null = send to SFU
                    sdp: offer.sdp
                }));
                log('Sent offer to SFU', 'success');

                publishBtn.disabled = true;
                unpublishBtn.disabled = false;
            } catch (err) {
                log(`Failed to publish: ${err}`, 'error');
            }
        };

        // Stop publishing
        unpublishBtn.onclick = () => {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
                localVideo.srcObject = null;
            }
            publishBtn.disabled = false;
            unpublishBtn.disabled = true;
            log('Stopped publishing', 'info');
        };

        // Disconnect
        disconnectBtn.onclick = () => {
            // Send leave message
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'Leave' }));
            }
            cleanup();
            log('Disconnected', 'info');
        };

        function cleanup() {
            if (ws) {
                ws.close();
                ws = null;
            }
            if (pc) {
                pc.close();
                pc = null;
            }
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            localVideo.srcObject = null;
            remoteVideo.srcObject = null;
            myParticipantId = null;
            
            connectBtn.disabled = false;
            publishBtn.disabled = true;
            unpublishBtn.disabled = true;
            disconnectBtn.disabled = true;
            
            updateStatus('wsStatus', 'Disconnected');
            updateStatus('rtcStatus', 'Not Started');
            updateStatus('iceStatus', '-');
            updateStatus('roomStatus', '-');
            updateStatus('participantId', '-');
        }

        // Periodic ping to keep connection alive
        setInterval(() => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'Ping' }));
            }
        }, 25000);
    </script>
</body>
</html>
