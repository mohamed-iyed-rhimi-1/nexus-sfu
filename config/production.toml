# Nexus SFU Production Configuration
# TigerStyle: Optimized for performance and reliability
#
# Configuration Sections (per architecture document Section 12):
# - transport: Media and signaling addresses, socket buffers, TLS, announced IPs
# - dataplane: Shards (busy polling, CPU pinning, packet buffers, timeouts)
# - room: Room limits and timeouts
# - bwe: Bandwidth estimation (GCC algorithm)
# - quic: QUIC signaling (unused: not started, WebSocket only)
# - gossip: SWIM gossip protocol for cluster state sync
# - metrics: Prometheus metrics endpoint
# - security: JWT authentication
# - logging: Structured logging configuration
# - api: REST API server
#
# Configuration Precedence: CLI > env > file > defaults
# Environment variables: NEXUS_JWT_SECRET, NEXUS_CONFIG_PATH, etc.

# Graceful drain timeout in milliseconds.
# When shutdown is initiated, the SFU will continue forwarding packets
# for this duration before terminating connections.
# Requirement 10.2: Continue forwarding for drain_timeout period
drain_timeout_ms = 30000                # 30 seconds for production

[transport]
media_bind_addr = "0.0.0.0:10000"
signaling_bind_addr = "0.0.0.0:443"
recv_buffer_size_bytes = 16777216       # 16MB
send_buffer_size_bytes = 16777216       # 16MB
max_webrtc_sessions = 10000             # Max concurrent WebRTC sessions
tls_cert_path = "/etc/nexus/tls/cert.pem"
tls_key_path = "/etc/nexus/tls/key.pem"

[room]
max_participants_per_room = 1000
max_rooms = 10000
empty_room_timeout_ms = 60000           # 1 minute

[bwe]
initial_bandwidth_bps = 1000000         # 1 Mbps
min_bandwidth_bps = 100000              # 100 Kbps
max_bandwidth_bps = 50000000            # 50 Mbps
loss_threshold_percent = 5
decrease_factor = 0.85
increase_bps = 100000

# Unused: QUIC signaling is not started (WebSocket only). Kept for when it is
# connected to the orchestrator.
[quic]
bind_addr = "0.0.0.0:443"
max_connections = 10000
max_session_tickets = 10000
session_ticket_ttl_secs = 86400
max_bi_streams = 100
max_uni_streams = 100
stream_recv_window_bytes = 1048576
connection_recv_window_bytes = 8388608
keep_alive_interval_ms = 30000
idle_timeout_ms = 60000
enable_0rtt = true
cert_path = "/etc/nexus/tls/cert.pem"
key_path = "/etc/nexus/tls/key.pem"

[gossip]
# SWIM gossip protocol configuration (used only when cluster.gossip_enabled)
probe_interval_ms = 1000
ping_timeout_ms = 1000
suspect_timeout_ms = 10000
fanout = 3
max_piggyback_updates = 16

# Seed peers for bootstrapping the cluster.
# Each entry specifies a known node to contact when joining.
# Format: { actor_id = <u64>, addr = "<ip>:<port>" }
# Example with multiple seed peers:
# seed_peers = [
#     { actor_id = 2, addr = "192.168.1.2:7946" },
#     { actor_id = 3, addr = "192.168.1.3:7946" },
# ]
seed_peers = []

[dataplane]
# The data plane (nexus-dataplane): one thread and one media socket per shard.
# Media sockets: transport.media_bind_addr is shard 0's port, shard i uses port + i.
shards = 1                              # Must be 1 in Phase 1
busy_poll_rounds = 256                  # Spin before parking (lower latency, more CPU)
pool_buffers = 1024                     # 2 KB packet buffers per shard
consent_timeout_ms = 30000              # Close a session after 30 s without authenticated traffic
rebind_silence_ms = 2000                # Accept a new client address after 2 s of silence
cpu_affinity = true                     # Pin shard i to core i
# SCHED_FIFO stays off: with busy polling and pinning, shard 0 would spin as a
# real-time thread on core 0 and could starve interrupts and the control plane there.
realtime_priority = false
realtime_priority_level = 80

[cluster]
# Unique node ID. Set to 0 for auto-generation from hostname+pid+time.
# In production multi-node clusters, set explicitly per node or use HOSTNAME env var.
node_id = 0
# Gossip (SWIM) with other nodes: off by default. v1 is single-node, and gossip is
# unauthenticated (any sender can spoof membership, rooms and tracks), so enable it
# only on a trusted network, bound to a specific interface (not 0.0.0.0).
# gossip_enabled = true
# gossip_bind_addr = "10.0.0.5:7946"
gossip_enabled = false

[metrics]
bind_addr = "0.0.0.0:9090"
collection_interval_ms = 1000
enable_prometheus = true

[security]
# MUST set NEXUS_JWT_SECRET environment variable
jwt_secret = ""                         # Empty = error if not overridden

[logging]
level = "info"                          # Less verbose in production
structured = true
include_timestamps = true
include_thread_ids = false              # Reduce log size

[api]
bind_addr = "0.0.0.0:8081"
jwt_secret = ""                         # MUST set NEXUS_JWT_SECRET environment variable
enabled = true

# ============================================================================
# ICE Server Configuration (Production)
# ============================================================================
# STUN/TURN servers for NAT traversal in WebRTC connections.
#
# Production Recommendations:
# 1. Deploy your own STUN/TURN servers for reliability and privacy
# 2. Use multiple STUN servers for redundancy
# 3. Configure TURN servers for clients behind restrictive NATs/firewalls
# 4. Use TURNS (TLS) for TURN servers in production
#
# Google Fallback:
# When use_google_fallback = true and no stun_servers are configured,
# Google's public STUN servers are used. This is NOT recommended for
# production as it introduces external dependencies.
#
# URL Formats:
#   STUN: stun:host:port or stuns:host:port (TLS)
#   TURN: turn:host:port or turns:host:port (TLS)
# ============================================================================
[ice_servers]
# Primary STUN servers (recommended: deploy your own)
# Example with your own STUN servers:
# stun_servers = [
#     "stun:stun.yourcompany.com:3478",
#     "stun:stun2.yourcompany.com:3478",
# ]
stun_servers = []

# Primary TURN servers (required for clients behind restrictive NATs)
# TURN credentials should be set via environment variables in production
turn_servers = []

# Google STUN fallback - set to false in production and use your own servers
# Setting to true means relying on external Google infrastructure
use_google_fallback = true

# Example production TURN configuration:
# [[ice_servers.turn_servers]]
# url = "turns:turn.yourcompany.com:443"
# username = "${TURN_USERNAME}"          # Set via environment variable
# credential = "${TURN_CREDENTIAL}"      # Set via environment variable

# Example with multiple TURN servers for redundancy:
# [[ice_servers.turn_servers]]
# url = "turns:turn1.yourcompany.com:443"
# username = "production-user"
# credential = "secure-credential-from-env"
#
# [[ice_servers.turn_servers]]
# url = "turns:turn2.yourcompany.com:443"
# username = "production-user"
# credential = "secure-credential-from-env"
