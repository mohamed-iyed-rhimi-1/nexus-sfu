# Nexus SFU Default Configuration (Development)
# TigerStyle: All values explicit, no magic numbers
#
# Configuration Precedence: CLI > env > file > defaults

# Graceful drain timeout in milliseconds.
# When shutdown is initiated, the SFU will continue forwarding packets
# for this duration before terminating connections.
drain_timeout_ms = 5000                 # 5 seconds for dev (faster shutdown)

[transport]
media_bind_addr = "127.0.0.1:10000"
signaling_bind_addr = "127.0.0.1:8080"
recv_buffer_size_bytes = 8388608        # 8MB (smaller for dev)
send_buffer_size_bytes = 8388608        # 8MB
max_webrtc_sessions = 1000              # Smaller limit for dev
tls_cert_path = ""                        # Empty = plain WS for development
tls_key_path = ""                         # Empty = plain WS for development

[room]
max_participants_per_room = 100         # Smaller limit for dev
max_rooms = 100
empty_room_timeout_ms = 30000           # 30 seconds (faster cleanup)

[bwe]
initial_bandwidth_bps = 1000000         # 1 Mbps
min_bandwidth_bps = 100000              # 100 Kbps
max_bandwidth_bps = 10000000            # 10 Mbps (lower for dev)
loss_threshold_percent = 5
decrease_factor = 0.85
increase_bps = 100000

# Unused: QUIC signaling is not started (WebSocket only). Kept for when it is
# connected to the orchestrator.
[quic]
bind_addr = "127.0.0.1:8443"
max_connections = 1000
max_session_tickets = 1000
session_ticket_ttl_secs = 86400
max_bi_streams = 100
max_uni_streams = 100
stream_recv_window_bytes = 1048576
connection_recv_window_bytes = 8388608
keep_alive_interval_ms = 5000
idle_timeout_ms = 30000
enable_0rtt = true
cert_path = "./certs/dev-cert.pem"
key_path = "./certs/dev-key.pem"

[gossip]
# SWIM gossip protocol configuration (used only when cluster.gossip_enabled)
probe_interval_ms = 1000
ping_timeout_ms = 500
suspect_timeout_ms = 5000
fanout = 3
max_piggyback_updates = 16

# Seed peers for bootstrapping the cluster.
# Empty in dev (single node mode)
seed_peers = []

[metrics]
bind_addr = "127.0.0.1:9090"
collection_interval_ms = 1000
enable_prometheus = true

[security]
# Override with NEXUS_JWT_SECRET in production
jwt_secret = "dev-secret-change-in-production"

[logging]
level = "debug"                         # Verbose in dev
structured = true
include_timestamps = true
include_thread_ids = true

[dataplane]
# The data plane (nexus-dataplane): one thread and one media socket per shard.
# Media sockets: transport.media_bind_addr is shard 0's port, shard i uses port + i.
# shards: 1..=16; shard i uses media port + i and, with cpu_affinity, core i. Each shard
# takes at most transport.max_webrtc_sessions / shards sessions (rounded up).
shards = 1
busy_poll_rounds = 0                    # Park as soon as idle
# 2 KB packet buffers per shard. Default: 1024 + (shards - 1) × 1024 (2 MB per shard
# at 1 shard, 8 MB at 4, 32 MB at 16: ≈ 512 MB in all); minimum: 320 + (shards - 1) × 1024
# (a credit of loans per peer).
# pool_buffers = 1024
consent_timeout_ms = 30000              # Close a session after 30 s without authenticated traffic
rebind_silence_ms = 2000                # Accept a new client address after 2 s of silence
cpu_affinity = false
realtime_priority = false
realtime_priority_level = 80
# Placement: a room's sessions go to one shard until it holds room_shard_max_sessions
# of them (or the shard is full, or above room_shard_max_pps received datagrams/s; 0 =
# off); then the least-loaded shard takes the room's next sessions. Tuned in Phase 2.6.
# room_shard_max_sessions = 50
# room_shard_max_pps = 0

[cluster]
# Unique node ID. Set to 0 for auto-generation from hostname+pid+time.
# In production, set explicitly or derive from HOSTNAME.
node_id = 0
# Gossip (SWIM) with other nodes: off by default. v1 is single-node, and gossip is
# unauthenticated (any sender can spoof membership, rooms and tracks), so enable it
# only on a trusted network, bound to a specific interface (not 0.0.0.0).
# gossip_enabled = true
# gossip_bind_addr = "10.0.0.5:7946"
gossip_enabled = false

# ============================================================================
# ICE Server Configuration
# ============================================================================
# STUN/TURN servers for NAT traversal in WebRTC connections.
# 
# STUN servers are used to discover the public IP address and port.
# TURN servers are used as relays when direct connectivity fails.
#
# Google Fallback Behavior:
# When use_google_fallback = true and no stun_servers are configured,
# the system automatically uses Google's public STUN servers:
#   - stun:stun.l.google.com:19302
#   - stun:stun1.l.google.com:19302
#   - stun:stun2.l.google.com:19302
#
# URL Formats:
#   STUN: stun:host:port or stuns:host:port (TLS)
#   TURN: turn:host:port or turns:host:port (TLS)
# ============================================================================
[ice_servers]
# Primary STUN servers (empty = use Google fallback)
stun_servers = []

# Primary TURN servers (optional, for relay when direct connectivity fails)
# Each TURN server requires url, username, and credential
turn_servers = []

# Use Google STUN servers as fallback when no primary STUN servers configured
# Set to false if you want to use only your own STUN servers
use_google_fallback = true

# Example TURN server configuration (uncomment to use):
# [[ice_servers.turn_servers]]
# url = "turn:turn.example.com:3478"
# username = "your-username"
# credential = "your-password"

# Example TURNS (TLS) server configuration:
# [[ice_servers.turn_servers]]
# url = "turns:turn.example.com:5349"
# username = "your-username"
# credential = "your-password"

[api]
bind_addr = "127.0.0.1:8081"
jwt_secret = "dev-secret-change-in-production"
enabled = true
