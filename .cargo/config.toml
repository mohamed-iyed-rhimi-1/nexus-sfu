# On aarch64 (Apple Silicon, Graviton) the RustCrypto crates only use the
# ARMv8 crypto instructions when built with these cfgs; without them SRTP
# falls back to much slower software code:
# - `aes_armv8`:     AES (both SRTP profiles)
# - `polyval_armv8`: PMULL for GHASH (the authentication half of AES-GCM)
# x86_64 detects AES-NI / CLMUL at runtime without a flag. SHA-1 hardware
# support is a Cargo feature instead (see crates/nexus-transport/Cargo.toml).
# Note: a RUSTFLAGS environment variable overrides these target rustflags.
[target.'cfg(target_arch = "aarch64")']
rustflags = ["--cfg", "aes_armv8", "--cfg", "polyval_armv8"]
