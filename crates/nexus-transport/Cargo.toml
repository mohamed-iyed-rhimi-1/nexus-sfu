[package]
name = "nexus-transport"
version = "0.1.0"
edition = "2021"
authors = ["Nexus Team"]
description = "UDP I/O, ICE, DTLS, SRTP, PacketArena, and RingBuffer for Nexus SFU"
license = "Apache-2.0"
repository = "https://github.com/nexus/nexus-sfu"
keywords = ["webrtc", "sfu", "transport", "udp"]
categories = ["multimedia", "network-programming"]

[dependencies]
nexus-core = { path = "../nexus-core" }
nexus-media = { path = "../nexus-media" }
memmap2 = "0.9"
crossbeam = "0.8"
core_affinity = "0.8"
thiserror = "1.0"
libc = "0.2"
tracing = "0.1"
tokio = { version = "1.44", features = ["net", "sync", "time", "macros", "rt", "rt-multi-thread"] }

# Cryptography for ICE/STUN/DTLS/SRTP
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
crc32fast = "1.3"
aes = "0.8"
aes-gcm = "0.10"
ctr = "0.9"
getrandom = "0.2"
ring = "0.17"
rcgen = "0.12"
openssl = { version = "0.10", features = ["vendored"] }

# Linux io_uring support (optional, Linux only)
[target.'cfg(target_os = "linux")'.dependencies]
io-uring = { version = "0.6", optional = true }

[features]
# Default features: enable io_uring on Linux for best performance
default = ["io_uring"]
io_uring = ["io-uring"]
# Simulation mode: no-op I/O, clock abstraction for deterministic testing
sim = []

[dev-dependencies]
proptest = "1.4"
webrtc-srtp = "0.12"
tokio = { version = "1.44", features = ["full"] }
