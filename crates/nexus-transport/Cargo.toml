[package]
name = "nexus-transport"
version = "0.1.0"
edition = "2021"
authors = ["Nexus Team"]
description = "SRTP, STUN, the OpenSSL DTLS engine and socket setup for Nexus SFU"
license = "Apache-2.0"
repository = "https://github.com/nexus/nexus-sfu"
keywords = ["webrtc", "sfu", "srtp", "dtls"]
categories = ["multimedia", "network-programming"]

[dependencies]
thiserror = "1.0"
libc = "0.2"
tracing = "0.1"
tokio = { version = "1.44", features = ["net", "sync", "time", "macros", "rt", "rt-multi-thread"] }

# Cryptography for ICE/STUN/DTLS/SRTP
hmac = "0.12"
sha1 = "0.10"
md-5 = "0.10"
crc32fast = "1.3"
aes = "0.8"
aes-gcm = "0.10"
ctr = "0.9"
getrandom = "0.2"
ring = "0.17"
openssl = { version = "0.10", features = ["vendored"] }
# SSL_ctrl for the DTLS retransmission timer, which the openssl crate does not wrap
openssl-sys = "0.9"
foreign-types = "0.3"

# SHA-1 (HMAC for SRTP_AES128_CM_SHA1_80, the profile browsers negotiate)
# only uses the ARMv8 SHA-1 instructions with the `asm` feature, detected at
# runtime. x86_64 uses SHA-NI without it.
[target.'cfg(target_arch = "aarch64")'.dependencies]
sha1 = { version = "0.10", features = ["asm"] }

[dev-dependencies]
proptest = "1.4"
webrtc-srtp = "0.12"
tokio = { version = "1.44", features = ["full"] }
