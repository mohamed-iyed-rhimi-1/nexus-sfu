[package]
name = "nexus-dataplane"
version = "0.1.0"
edition = "2021"
authors = ["Nexus Team"]
description = "Sharded media data plane for Nexus SFU: sessions, ICE-lite, SRTP, RTP forwarding"
license = "Apache-2.0"
repository = "https://github.com/nexus/nexus-sfu"
keywords = ["webrtc", "sfu", "rtp", "media"]
categories = ["multimedia", "network-programming"]

[dependencies]
nexus-core = { path = "../nexus-core" }
nexus-media = { path = "../nexus-media" }
nexus-transport = { path = "../nexus-transport" }
crossbeam-queue = "0.3"
rustc-hash = "2"

[dev-dependencies]
proptest = "1.4"
