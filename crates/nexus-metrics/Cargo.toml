[package]
name = "nexus-metrics"
version = "0.1.0"
edition = "2021"

[dependencies]
# Prometheus client
prometheus = { version = "0.13", default-features = false }

# Shared types
nexus-core = { path = "../nexus-core" }
# Shard stats (exported per shard, design note §5.4)
nexus-dataplane = { path = "../nexus-dataplane" }

# Async runtime for HTTP server
tokio = { version = "1.35", features = ["sync", "time"] }

# Lock-free data structures
parking_lot = "0.12"

# Logging
tracing = "0.1"

[dev-dependencies]
tokio-test = "0.4"
