[package]
name = "nexus-signal"
version = "0.1.0"
edition = "2021"

[dependencies]
# QUIC transport
quinn = "0.11"
rustls = "0.23"
rustls-pemfile = "2.0"

# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-util = "0.7"

# WebSocket fallback + TLS
tokio-tungstenite = "0.21"
tokio-rustls = "0.26"
futures-util = "0.3"

# Concurrency
dashmap = "5.5"
parking_lot = "0.12"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
capnp = "0.19"

# Error handling
thiserror = "1.0"

# Logging
tracing = "0.1"

# Shared types
nexus-core = { path = "../nexus-core" }
nexus-state = { path = "../nexus-state" }
nexus-api = { path = "../nexus-api" }

# Metrics
prometheus = { version = "0.13", optional = true }

# Cryptography for session tickets
rand = "0.8"

[build-dependencies]
capnpc = "0.19"

[dev-dependencies]
proptest = "1.4"
tokio-test = "0.4"
tracing-subscriber = "0.3"

[features]
default = []
metrics = ["prometheus"]
capnp = []
