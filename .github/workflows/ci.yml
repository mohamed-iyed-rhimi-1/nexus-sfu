name: CI

on:
  # Every branch, not just main: work happens on feature/version branches
  # (e.g. v0.1.0), and a Linux-only build break went unnoticed there.
  push:
  pull_request:

# A newer push to the same branch or PR cancels the older run, except on
# main and tags, where every commit keeps its complete run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  # Do not set RUSTFLAGS here. It replaces the target rustflags in
  # .cargo/config.toml, which enable ARMv8 AES/PMULL for SRTP. Warnings are
  # already errors via #![deny(warnings)] and `clippy -D warnings`.

jobs:
  fmt:
    name: Format
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.83.0"
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.83.0"
          components: clippy
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y capnproto protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.arch }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          # arm64 builds the code behind aarch64 cfgs (ARMv8 AES / PMULL /
          # SHA-1), which an x86_64-only CI never compiles.
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.83.0"
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y capnproto protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --bin nexus-sfu
      - run: cargo test --workspace --locked

  bench-smoke:
    name: Bench smoke (${{ matrix.arch }})
    timeout-minutes: 60
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.83.0"
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y capnproto protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      # Runs every real-path benchmark once to check it still works (not a
      # timing measurement: shared CI runners are too noisy for that). It
      # also prints allocations per packet and drop counters per id.
      - run: cargo bench --locked --bench real_path -- --test
      # Fails if a participant publishing audio + video and subscribed to 10
      # tracks holds more session state than the budget (design §3.11: data
      # plane plus control plane; signaling is reported, not checked).
      # Measured 16.9 KB in Phase 1.7 (1.55 MB at v0.1.0).
      - run: cargo bench --locked --bench memory
        env:
          NEXUS_MEM_BUDGET_KB: "25"

  # macOS runs the portable shard I/O (`PortableIo`) and the code behind
  # `cfg(not(target_os = "linux"))`, which the Linux jobs never compile.
  macos:
    name: Test (macOS arm64)
    timeout-minutes: 60
    runs-on: macos-14
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.83.0"
          components: clippy
      - name: Install system dependencies
        run: brew install capnp protobuf
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The default open-file limit on macOS runners is 256; the e2e and
      # loopback tests open many sockets. `ulimit` lasts one step's shell, so
      # it is set in the same step as the tests.
      - run: ulimit -n 4096 && cargo test --workspace --locked

  docker:
    name: Docker image
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
